# Build ZonalStats.exe on Windows and attach it to a GitHub release.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Smoke test
        run: python tests/smoke_test.py

      - name: Build exe
        run: pyinstaller ZonalStats.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: ZonalStats
          path: dist/ZonalStats.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZonalStats.exe
          generate_release_notes: true
